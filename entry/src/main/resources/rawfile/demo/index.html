<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Weather Widget</title>
  <style>
    :root { color-scheme: dark; }
    html { height: 100%; }
    body {
      margin: 0;
      box-sizing: border-box;
      min-height: 100vh;
      /* Round-screen safe area: padding is a % of viewport width, so the top/
         bottom insets keep content inside the inscribed circle of a 466x466
         round watch. Content scrolls vertically when it overflows. */
      padding: 17% 13% 20%;
      background: #101014;
      color: #f2f2f2;
      font-family: -apple-system, system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-align: center;
    }
    .card {
      max-width: 340px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .temp { font-size: 28px; font-weight: 700; }
    .coords { font-size: 12px; color: #b0b0b8; min-height: 16px; margin: 6px 0; }
    .status { font-size: 11px; color: #8e8e93; min-height: 14px; }
    /* The buttons are also usable standalone; ArkTS drives the same functions
       via runJavaScript(). */
    .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; justify-content: center; }
    button {
      flex: 1 1 42%;
      background: #1c1c22;
      color: #4c8dff;
      border: 1px solid #2c2c34;
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>☁️ Weather</h1>
    <div class="temp" id="temp">--°</div>
    <div class="coords" id="coords">Location unknown</div>
    <div class="status" id="status">Ready</div>

    <div class="controls">
      <button onclick="triggerGeolocation()">Locate</button>
      <button onclick="triggerConsole()">Log</button>
      <button onclick="triggerAlert()">Alert</button>
      <button onclick="triggerConfirm()">Confirm</button>
      <button onclick="triggerPrompt()">Prompt</button>
      <button onclick="triggerMicrophone()">Microphone</button>
      <button onclick="triggerNetError()">Net error</button>
    </div>
  </div>
  <script src="demo.js"></script>
</body>
</html>
